<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق قاعدة المعرفة - مشروع د. مروة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏫 نظام الاستعلام الأكاديمي</h1>
            <h2>مدرسة النجاح باليعر</h2>
            <p class="subtitle"> من قاعدة المعرفة 
            </p>
        </header>

        <div class="card">
            <div class="form-group">
                <label for="gradeSelect">1. اختر الصف الدراسي (قائمة منسدلة):</label>
                <select id="gradeSelect">
                    <option value="">-- جاري تحميل البيانات من JSON --</option>
                </select>
            </div>

            <div class="form-group" id="subjectsGroup" style="display: none;">
                <label>2. حدد المواد للاستعلام عنها (Checkboxes):</label>
                <div id="checkboxesContainer" class="checkbox-grid">
                    <!-- Checkboxes will be injected here dynamically -->
                </div>
            </div>

            <button id="queryBtn" style="display: none;">🔍 عرض معلومات المواد المحددة</button>
        </div>

        <div id="resultsArea" class="results-container" style="display: none;">
            <h3>📋 نتائج الاستعلام من قاعدة المعرفة:</h3>
            <div id="resultsContent"></div>
        </div>
    </div>

    <script src="fallback_kb.js"></script>
    <script src="script.js"></script>
</body>
</html>
